<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Глобальная Тактическая Карта</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #111; color: #fff; overflow: hidden; user-select: none;
        }
        #mapCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: grab; background-color: #141416; }
        #mapCanvas:active { cursor: grabbing; }

        /* Панели интерфейса */
        .war-status-bar {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 1000;
            background: rgba(20, 20, 20, 0.9); border: 1px solid #444; padding: 10px 20px;
            border-radius: 6px; display: flex; gap: 25px; font-size: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(4px);
        }
        .status-item span { font-weight: bold; color: #ff4d4d; }

        /* Боковое меню */
        .sidebar {
            position: absolute; top: 0; left: -300px; width: 260px; height: 100%;
            background: rgba(25, 25, 25, 0.98); border-right: 1px solid #333; z-index: 2000;
            transition: left 0.3s ease; padding: 20px; box-shadow: 5px 0 15px rgba(0,0,0,0.5); box-sizing: border-box;
        }
        .sidebar.active { left: 0; }
        .sidebar-toggle {
            position: absolute; top: 15px; left: 15px; z-index: 2001;
            background: #222; border: 1px solid #444; color: #fff; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 18px;
        }
        .sidebar h3 { margin-top: 40px; border-bottom: 1px solid #444; padding-bottom: 5px; color: #dae0e6; }

        /* Инструменты редактирования */
        .tools-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000;
            background: rgba(25, 25, 25, 0.9); border: 1px solid #444; padding: 8px; border-radius: 6px;
            display: flex; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .btn {
            background: #333; border: 1px solid #555; color: #fff; padding: 6px 12px;
            border-radius: 4px; cursor: pointer; font-size: 13px;
        }
        .btn:hover { background: #444; }
        .btn.active { background: #ff9900; color: #000; font-weight: bold; border-color: #ff9900; }

        .faction-filter { display: flex; align-items: center; gap: 10px; margin: 10px 0; cursor: pointer; }
        .faction-color { width: 12px; height: 12px; border-radius: 50%; }
        #map-tooltip {
            position: absolute; z-index: 3000; background: rgba(20, 20, 20, 0.95);
            border: 1px solid #555; padding: 8px 12px; border-radius: 4px; font-size: 13px;
            display: none; pointer-events: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>

    <div class="sidebar" id="sidebar">
        <h3 id="menu-title">Тактическое меню</h3>
        <div class="faction-filter">
            <input type="checkbox" id="layerFaction1" checked onchange="redraw()">
            <div class="faction-color" style="background: #ff4d4d;"></div>
            <span id="f1-name">Красный Альянс</span>
        </div>
        <div class="faction-filter">
            <input type="checkbox" id="layerFaction2" checked onchange="toggleLayers()">
            <div class="faction-color" style="background: #3399ff;"></div>
            <span id="f2-name">Синяя Федерация</span>
        </div>
    </div>

    <div class="war-status-bar">
        <div class="status-item"><span id="lbl-forces">Силы сторон:</span> <span id="val-forces" style="color: #fff;">620,000</span></div>
        <div class="status-item"><span id="lbl-losses">Потери:</span> <span id="val-losses">18,100</span></div>
        <div class="status-item"><span id="lbl-scale">Масштаб:</span> <span style="color: #ff9900;">1x</span></div>
    </div>

    <!-- Панель переключения режимов -->
    <div class="tools-panel">
        <button class="btn active" id="btn-move" onclick="setMode('move')">🖐 Двигать карту</button>
        <button class="btn" id="btn-marker" onclick="setMode('addMarker')">📍 Ставить базы</button>
        <button class="btn" id="btn-line" onclick="setMode('addLine')">✏️ Линия фронта</button>
        <button class="btn" style="background: #c62828;" onclick="clearMap()">🗑 Очистить рисунки</button>
    </div>

    <div id="map-tooltip"></div>
    <canvas id="mapCanvas"></canvas>

    <!-- Подключаем конфигурационные файлы напрямую из твоего репозитория -->
    <script src="config.js"></script>
</body>
</html>
